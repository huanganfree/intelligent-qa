server {
    listen 80;
    server_name _;

    # 1. 统一匹配静态页面
    location /ha-project/aiQA/ {
        alias /usr/share/nginx/html/;
        index index.html index.htm;
        # try_files $uri $uri/ /ha-project/aiQA/index.html;
         # 1. 尝试寻找真实存在的静态资源（如 js, css, 图片）
        # 2. 如果找不到（说明是 Vue 的路由），则丢给下面的 @router 处理
        try_files $uri $uri/ @router;
    }

    # 专门用来解决 alias + try_files 拼接 Bug 的命名块
    location @router {
        # 强制将所有动态路由重写为 alias 目录下的 index.html
        rewrite ^.*$ /ha-project/aiQA/index.html last;
    }

    # 2. 统一匹配图片资源
    # location /ha-project/admin/uploads/ {
    #     alias /usr/share/nginx/html/uploads/;
    #     expires 7d;
    # }

    # 3. 统一匹配后端 API 接口
    location /ha-project/aiQA/api/ {
        # 🌟 关键：转发给 Koa 时抹去 /ha-project/aiQA/ 前缀，保留 /api/ 给 Koa 的 JWT 校验
        proxy_pass http://app:8004/api/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
}